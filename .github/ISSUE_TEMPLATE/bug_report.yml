name: Bug report
description: Something crashed, hung, or otherwise did not work
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        For a check that ran fine but produced the *wrong answer*, please use
        the "Incorrect finding" template instead.

        For anything exploitable — an SSRF-guard bypass, injection, path
        traversal — please email <security@certnotify.com> rather than opening
        a public issue. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Command that reproduces it
      description: The exact command, including the target if it is public.
      render: shell
      placeholder: certnotify scan example.com --only ssl,headers
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: Full output, including the stack trace if there is one.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: certnotify version
      placeholder: 0.3.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.11.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - npx
        - global install (npm i -g)
        - as a library import
        - Docker
        - GitHub Action
        - from source
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
