name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # These hit real, live third-party services (RDAP, DNS-over-HTTPS,
      # public DNSBL zones) against a couple of well-known stable domains —
      # by design, this package has no mocks. A transient failure here is
      # usually a third-party hiccup; re-run before assuming a regression.
      - name: Test
        run: npm test
